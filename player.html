<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>CYBERHAX — Player</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #050d1a; font-family: 'Segoe UI', sans-serif; color: #c5dff8; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px; }

  h1 { font-size: 22px; font-weight: 700; letter-spacing: 3px; color: #7ec8ff; margin-bottom: 4px; }
  .sub { font-size: 12px; color: #3fa0ff; letter-spacing: 1px; margin-bottom: 24px; }

  .card {
    width: 100%; max-width: 400px;
    background: #0a1628;
    border: 1.5px solid #1a3050;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 14px;
  }
  .card h2 { font-size: 14px; font-weight: 600; color: #3fa0ff; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 14px; }

  input[type=text] {
    width: 100%; padding: 12px 14px;
    background: #0d1f3a; border: 1px solid #1a6fdb55;
    border-radius: 8px; color: #c5dff8; font-size: 16px;
    font-family: 'Segoe UI', sans-serif;
    outline: none; margin-bottom: 12px;
  }
  input[type=text]:focus { border-color: #1a6fdb; }
  input[type=text]::placeholder { color: #3a6a9a; }

  button {
    width: 100%; padding: 14px;
    border-radius: 10px; border: 1.5px solid #1a6fdb;
    background: #0d2040; color: #7ec8ff;
    font-size: 16px; font-weight: 600;
    cursor: pointer; font-family: 'Segoe UI', sans-serif;
    letter-spacing: 1px; transition: background 0.15s;
  }
  button:hover { background: #1a3a6a; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.danger { border-color: #a32d2d; color: #f09595; background: #1a0808; }

  .status-pill {
    display: inline-block;
    padding: 4px 14px; border-radius: 20px;
    font-size: 12px; font-weight: 600; letter-spacing: 1px;
    margin-bottom: 14px;
  }
  .status-pill.waiting { background: #1a3a6a; color: #7ec8ff; }
  .status-pill.your-turn { background: #0c3d20; color: #5dcaa5; animation: glow-green 1.5s infinite; }
  .status-pill.answering { background: #2a1a08; color: #f5c23d; }
  .status-pill.other-turn { background: #1a1a2a; color: #7a8aaa; }
  @keyframes glow-green { 0%,100%{box-shadow:0 0 6px #1d9e7566} 50%{box-shadow:0 0 14px #1d9e75aa} }

  .tile-display { text-align: center; margin: 10px 0; }
  .tile-num { font-size: 48px; font-weight: 700; color: #7ec8ff; line-height: 1; }
  .tile-label { font-size: 12px; color: #3a6a9a; margin-top: 4px; }

  .dice-face { font-size: 56px; text-align: center; margin: 10px 0; line-height: 1; min-height: 64px; }

  /* Question */
  .q-cat { font-size: 11px; color: #3fa0ff; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
  .q-text { font-size: 16px; color: #c5dff8; line-height: 1.5; margin-bottom: 16px; font-weight: 500; }
  .q-opts { display: flex; flex-direction: column; gap: 8px; }
  .q-opt {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; border-radius: 8px;
    border: 1px solid #1a6fdb55; background: #0d2040;
    color: #c5dff8; font-size: 14px;
    cursor: pointer; transition: border-color 0.15s, background 0.15s;
    font-family: 'Segoe UI', sans-serif; text-align: left;
    width: 100%;
  }
  .q-opt .letter { font-size: 11px; color: #3fa0ff; font-weight: 700; flex-shrink: 0; }
  .q-opt:hover:not(:disabled) { border-color: #3fa0ff; background: #0f2545; }
  .q-opt.correct { border-color: #1d9e75; background: #0c3d20; color: #5dcaa5; }
  .q-opt.wrong { border-color: #a32d2d; background: #280a0a; color: #f09595; }
  .q-opt:disabled { cursor: not-allowed; }

  .result-box { text-align: center; padding: 12px; border-radius: 10px; font-size: 15px; font-weight: 600; margin-top: 10px; }
  .result-box.correct { background: #0c3d20; color: #5dcaa5; border: 1px solid #1d9e75; }
  .result-box.wrong { background: #280a0a; color: #f09595; border: 1px solid #a32d2d; }

  .player-list { display: flex; flex-direction: column; gap: 6px; }
  .p-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; background: #0d1f3a; border: 1px solid #1a3050; }
  .p-row.me { border-color: #1a6fdb; background: #0d2040; }
  .p-avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
  .p-name { font-size: 13px; flex: 1; }
  .p-tile { font-size: 12px; color: #3a6a9a; }

  .hidden { display: none; }

  .win-box { text-align: center; }
  .win-box .trophy { font-size: 56px; margin-bottom: 8px; }
  .win-box h2 { font-size: 20px; color: #7ec8ff; font-weight: 700; margin-bottom: 6px; }
  .win-box p { font-size: 13px; color: #3fa0ff; }

  #msg { font-size: 13px; color: #f09595; text-align: center; margin-top: 8px; min-height: 20px; }
</style>
</head>
<body>

<h1>&#x1F4BB; CYBERHAX</h1>
<p class="sub">PLAYER VIEW</p>

<!-- JOIN SCREEN -->
<div class="card" id="join-screen">
  <h2>Join Game</h2>
  <input type="text" id="name-input" placeholder="Enter your hacker name..." maxlength="16" />
  <button onclick="joinGame()">JOIN MATCH</button>
  <p id="msg"></p>
</div>

<!-- GAME SCREEN -->
<div id="game-screen" class="hidden">

  <div class="card" style="text-align:center;">
    <div class="status-pill waiting" id="status-pill">Waiting...</div>
    <div class="tile-display">
      <div class="tile-num" id="my-tile">1</div>
      <div class="tile-label">current tile</div>
    </div>
  </div>

  <!-- Roll card -->
  <div class="card" id="roll-card" style="text-align:center;">
    <h2>Your Turn!</h2>
    <div class="dice-face" id="dice-face">🎲</div>
    <button id="roll-btn" onclick="rollDice()">ROLL DICE</button>
  </div>

  <!-- Waiting card -->
  <div class="card hidden" id="wait-card" style="text-align:center;">
    <h2>Waiting...</h2>
    <p style="color:#3a6a9a;font-size:14px;margin-top:8px;" id="wait-msg">Another player is taking their turn</p>
  </div>

  <!-- Question card -->
  <div class="card hidden" id="q-card">
    <h2>&#x1F535; Cybersec Challenge!</h2>
    <div class="q-cat" id="q-cat-p"></div>
    <div class="q-text" id="q-text-p"></div>
    <div class="q-opts" id="q-opts-p"></div>
    <div class="result-box hidden" id="q-result"></div>
  </div>

  <!-- Players card -->
  <div class="card">
    <h2>Players</h2>
    <div class="player-list" id="p-list"></div>
  </div>

  <div class="card">
    <button class="danger" onclick="leaveGame()">LEAVE GAME</button>
  </div>

</div>

<!-- WIN SCREEN -->
<div class="card hidden" id="win-screen">
  <div class="win-box">
    <div class="trophy">🏆</div>
    <h2 id="win-msg">You win!</h2>
    <p id="win-sub"></p>
    <br/>
    <button onclick="location.reload()">PLAY AGAIN</button>
  </div>
</div>

<script src="firebase-config.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, set, get, onValue, update, remove, onDisconnect } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const CYBER_TILES = new Set([3,7,11,15,18,22,25,29,33,36,39,42,45,48]);
  const DICE_FACES = ['⚀','⚁','⚂','⚃','⚄','⚅'];
  const PLAYER_COLORS = [
    {bg:'#1a3a5c',border:'#378add',text:'#85b7eb'},
    {bg:'#3a1a0c',border:'#d85a30',text:'#f0997b'},
    {bg:'#1a3a1a',border:'#1d9e75',text:'#5dcaa5'},
    {bg:'#3a1a2e',border:'#d4537e',text:'#ed93b1'},
  ];

  const QUESTIONS = [
    {q:"What does 'phishing' refer to?", opts:["Attacking servers directly","Tricking users into revealing credentials","Encrypting files for ransom","Sniffing network traffic"], ans:1, cat:"Social Engineering"},
    {q:"What port does HTTPS use by default?", opts:["80","21","443","8080"], ans:2, cat:"Networking"},
    {q:"What is a zero-day vulnerability?", opts:["A bug fixed within 24 hours","An exploit unknown to the vendor","A daily scheduled scan","A firewall misconfiguration"], ans:1, cat:"Vulnerabilities"},
    {q:"Which algorithm is asymmetric encryption?", opts:["AES","DES","RSA","3DES"], ans:2, cat:"Cryptography"},
    {q:"What does SQL injection exploit?", opts:["Weak passwords","Unvalidated user input in queries","Open ports","Outdated antivirus"], ans:1, cat:"Web Security"},
    {q:"What is a VPN primarily used for?", opts:["Speed up internet","Encrypt and tunnel traffic","Block ads","Manage passwords"], ans:1, cat:"Networking"},
    {q:"What does CIA stand for in cybersecurity?", opts:["Control, Integrity, Access","Confidentiality, Integrity, Availability","Cipher, Identity, Authentication","Central Intelligence Agency"], ans:1, cat:"Fundamentals"},
    {q:"What is a brute-force attack?", opts:["Physically breaking hardware","Trying all possible passwords","Exploiting software bugs","Intercepting packets"], ans:1, cat:"Attacks"},
    {q:"What is two-factor authentication (2FA)?", opts:["Two passwords","Password + a second verification factor","Biometric only","Encrypted login"], ans:1, cat:"Authentication"},
    {q:"What does a firewall do?", opts:["Encrypts data","Monitors and filters network traffic","Scans for viruses","Generates passwords"], ans:1, cat:"Defense"},
    {q:"What is ransomware?", opts:["Spyware that steals data","Malware that encrypts files for payment","A phishing email","A DoS tool"], ans:1, cat:"Malware"},
    {q:"What is steganography?", opts:["Encrypting messages","Hiding data inside other files","Breaking ciphers","Password cracking"], ans:1, cat:"Cryptography"},
    {q:"Which protocol is used to securely log into remote servers?", opts:["FTP","Telnet","SSH","HTTP"], ans:2, cat:"Protocols"},
    {q:"What does 'OSINT' stand for?", opts:["Open Source Intelligence","Operational Security Interface","Online Security Integration","Object Signal Intelligence"], ans:0, cat:"Reconnaissance"},
  ];

  let myId = null;
  let myName = '';
  let gameUnsub = null;

  window.joinGame = async function() {
    const input = document.getElementById('name-input');
    const name = input.value.trim();
    if (!name) { document.getElementById('msg').textContent = 'Enter a name first!'; return; }

    const snap = await get(ref(db, 'game/players'));
    const players = snap.val() || {};
    const count = Object.keys(players).length;
    if (count >= 4) { document.getElementById('msg').textContent = 'Game full (max 4 players)!'; return; }

    myId = 'p_' + Date.now();
    myName = name;

    // Add score: 0 to the initial state
    const myPlayerRef = ref(db, `game/players/${myId}`);
    await set(myPlayerRef, { name, pos: 1, score: 0, joined: Date.now() });
  
    // MAGIC FIX: Tells Firebase to delete this player if the socket connection drops (tab closed)
    onDisconnect(myPlayerRef).remove();

    if (count === 0) {
      await update(ref(db, 'game'), { status: 'waiting', currentTurn: myId, lastLog: `${name} created the game`, lastLogType: 'good' });
    } else {
      await update(ref(db, 'game'), { lastLog: `${name} joined the game`, lastLogType: '' });
    }

    document.getElementById('join-screen').classList.add('hidden');
    document.getElementById('game-screen').classList.remove('hidden');
    listenGame();
  };

  function listenGame() {
    gameUnsub = onValue(ref(db, 'game'), snap => {
      const game = snap.val();
      if (!game) return;
      const players = game.players || {};
      const currentTurn = game.currentTurn;
      const status = game.status;
      const qState = game.question;
      const isMyTurn = currentTurn === myId;

      // Update tile
      const me = players[myId];
      if (!me) return;
      document.getElementById('my-tile').textContent = me.pos || 1;

      // Players list
      const pList = document.getElementById('p-list');
      pList.innerHTML = '';
      Object.entries(players).forEach(([id,p],i) => {
        const row = document.createElement('div');
        row.className = 'p-row' + (id===myId?' me':'');
        const c = PLAYER_COLORS[i % PLAYER_COLORS.length];
        row.innerHTML = `
          <div class="p-avatar" style="background:${c.bg};border:1.5px solid ${c.border};color:${c.text};">${(p.name||'?')[0].toUpperCase()}</div>
          <span class="p-name">${p.name}${id===myId?' (you)':''}</span>
          <span class="p-tile">Tile ${p.pos||1}</span>
        `;
        pList.appendChild(row);
      });

      // Win check
      if (status === 'finished') {
        const winner = Object.values(players).find(p=>p.pos>=50);
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('win-screen').classList.remove('hidden');
        if (winner && winner.name === myName) {
          document.getElementById('win-msg').textContent = '🏆 You win!';
          document.getElementById('win-sub').textContent = 'You conquered CYBERHAX!';
        } else {
          document.getElementById('win-msg').textContent = `${winner?.name||'Someone'} wins!`;
          document.getElementById('win-sub').textContent = 'Better luck next time.';
        }
        return;
      }

      // Question state
      if (qState && !qState.answered && qState.playerId === myId) {
        showQuestionUI(qState.qIdx);
        return;
      } else {
        document.getElementById('q-card').classList.add('hidden');
      }

      // Turn UI
      const pill = document.getElementById('status-pill');
      if (isMyTurn) {
        pill.className = 'status-pill your-turn'; pill.textContent = 'YOUR TURN';
        document.getElementById('roll-card').classList.remove('hidden');
        document.getElementById('wait-card').classList.add('hidden');
      } else {
        const cp = players[currentTurn];
        pill.className = 'status-pill other-turn'; pill.textContent = 'Waiting...';
        document.getElementById('roll-card').classList.add('hidden');
        document.getElementById('wait-card').classList.remove('hidden');
        document.getElementById('wait-msg').textContent = cp ? `${cp.name} is taking their turn` : 'Waiting...';
      }
    });
  }

  function showQuestionUI(qIdx) {
    const q = QUESTIONS[qIdx];
    document.getElementById('roll-card').classList.add('hidden');
    document.getElementById('wait-card').classList.add('hidden');
    document.getElementById('q-card').classList.remove('hidden');
    document.getElementById('q-result').classList.add('hidden');
    document.getElementById('q-cat-p').textContent = '🔵 ' + q.cat;
    document.getElementById('q-text-p').textContent = q.q;
    const optsEl = document.getElementById('q-opts-p');
    optsEl.innerHTML = '';
    q.opts.forEach((o,i) => {
      const btn = document.createElement('button');
      btn.className = 'q-opt';
      btn.innerHTML = `<span class="letter">${String.fromCharCode(65+i)}</span>${o}`;
      btn.onclick = () => submitAnswer(i, q, btn, optsEl);
      optsEl.appendChild(btn);
    });
  }

  async function submitAnswer(chosen, q, btn, optsEl) {
    optsEl.querySelectorAll('.q-opt').forEach(b => b.disabled = true);
    const correct = chosen === q.ans;
    optsEl.querySelectorAll('.q-opt')[q.ans].classList.add('correct');
    if (!correct) btn.classList.add('wrong');

    const result = document.getElementById('q-result');
    result.className = 'result-box ' + (correct?'correct':'wrong');
    result.textContent = correct ? '✅ Correct! +1 Point! Roll again!' : '❌ Wrong! Your turn ends.';
    result.classList.remove('hidden');

    // Increment score if correct
    if (correct) {
      const meSnap = await get(ref(db, `game/players/${myId}`));
      const currentScore = meSnap.val()?.score || 0;
      await update(ref(db, `game/players/${myId}`), { score: currentScore + 1 });
    }

    await update(ref(db, 'game'), {
      'question/answered': true,
      'question/correct': correct,
      lastLog: correct ? `✅ ${myName} answered correctly and gained 1 pt! Rolling again!` : `❌ ${myName} got it wrong. Next player's turn.`,
      lastLogType: correct ? 'good' : 'bad'
    });

    setTimeout(async () => {
      if (correct) {
        document.getElementById('q-card').classList.add('hidden');
        document.getElementById('roll-card').classList.remove('hidden');
        await update(ref(db,'game'), { question: null });
      } else {
        document.getElementById('q-card').classList.add('hidden');
        await nextTurn();
      }
    }, 1800);
  }

  window.rollDice = async function() {
    const btn = document.getElementById('roll-btn');
    btn.disabled = true;

    let i=0, face=0;
    await new Promise(res => {
      const iv = setInterval(()=>{
        face = Math.floor(Math.random()*6);
        document.getElementById('dice-face').textContent = DICE_FACES[face];
        if(++i>10){ clearInterval(iv); res(); }
      }, 60);
    });

    const roll = face+1;
    const snap = await get(ref(db, `game/players/${myId}`));
    const me = snap.val();
    const newPos = Math.min((me.pos||1)+roll, 50);

    await update(ref(db, `game/players/${myId}`), { pos: newPos });
    await update(ref(db, 'game'), {
      lastLog: `🎲 ${myName} rolled ${roll} → Tile ${newPos}`,
      lastLogType: ''
    });

    btn.disabled = false;

    if (newPos >= 50) {
      await update(ref(db, 'game'), {
        status: 'finished',
        lastLog: `🏆 ${myName} reached tile 50 and wins!`,
        lastLogType: 'good'
      });
      return;
    }

    if (CYBER_TILES.has(newPos)) {
      const usedSnap = await get(ref(db,'game/usedQ'));
      const used = usedSnap.val() || [];
      const pool = QUESTIONS.map((_,i)=>i).filter(i=>!used.includes(i));
      const available = pool.length > 0 ? pool : QUESTIONS.map((_,i)=>i);
      const qIdx = available[Math.floor(Math.random()*available.length)];
      used.push(qIdx);
      if (used.length >= QUESTIONS.length) await set(ref(db,'game/usedQ'), []);
      else await set(ref(db,'game/usedQ'), used);

      await update(ref(db,'game'), {
        question: { qIdx, playerId: myId, answered: false },
        lastLog: `🔵 ${myName} hit a Cybersec tile!`,
        lastLogType: 'cyber'
      });
    } else {
      await nextTurn();
    }
  };

  async function nextTurn() {
    const snap = await get(ref(db,'game'));
    const game = snap.val();
    const players = game.players || {};
    const ids = Object.keys(players).sort((a,b)=>players[a].joined-players[b].joined);
    const idx = ids.indexOf(myId);
    const nextId = ids[(idx+1) % ids.length];
    await update(ref(db,'game'), {
      currentTurn: nextId,
      question: null,
      lastLog: `↪ ${players[nextId].name}'s turn`,
      lastLogType: ''
    });
  }

  window.leaveGame = async function() {
    if (!myId) return;
    await remove(ref(db, `game/players/${myId}`));
    location.reload();
  };
</script>
</body>
</html>
